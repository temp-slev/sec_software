# Дополнение к practice12/monitoring/values.yaml для общего Helm-релиза.
grafana:
  grafana.ini:
    smtp:
      enabled: true
      host: mailpit.practice13.svc.cluster.local:1025
      from_address: grafana@example.test
      from_name: Practice 13 Grafana
      startTLS_policy: NoStartTLS
  alerting:
    contactpoints.yaml:
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: practice13-email
          receivers:
            - uid: practice13-email
              type: email
              settings:
                addresses: alerts@example.test
                singleEmail: false
    policies.yaml:
      apiVersion: 1
      policies:
        - orgId: 1
          receiver: practice13-email
          group_by: [grafana_folder, alertname]
          group_wait: 10s
          group_interval: 30s
          repeat_interval: 1h
    rules.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: fastapi-practice13
          folder: Practice 13
          interval: 30s
          rules:
            - uid: fastapi5xx13
              title: FastAPI 5xx over 5 percent
              condition: C
              for: 30s
              noDataState: OK
              execErrState: Error
              annotations:
                summary: 'Доля ответов 5xx за последние 5 минут превысила 5%'
              labels:
                practice: '13'
                severity: warning
              data:
                - refId: A
                  datasourceUid: prometheus
                  relativeTimeRange: {from: 300, to: 0}
                  model:
                    datasource: {type: prometheus, uid: prometheus}
                    expr: '100 * sum(rate(http_requests_total{namespace="practice13",status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total{namespace="practice13"}[5m])), 0.000001)'
                    instant: true
                    intervalMs: 15000
                    maxDataPoints: 43200
                    refId: A
                - refId: B
                  datasourceUid: __expr__
                  relativeTimeRange: {from: 300, to: 0}
                  model:
                    type: reduce
                    expression: A
                    reducer: last
                    refId: B
                    intervalMs: 15000
                    maxDataPoints: 43200
                - refId: C
                  datasourceUid: __expr__
                  relativeTimeRange: {from: 300, to: 0}
                  model:
                    type: threshold
                    expression: B
                    refId: C
                    conditions:
                      - evaluator: {type: gt, params: [5]}
                        operator: {type: and}
                        query: {params: [C]}
                        reducer: {type: last, params: []}
                        type: query
