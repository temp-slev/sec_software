apiVersion: v1
kind: Namespace
metadata:
  name: practice13
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-app
  namespace: practice13
spec:
  replicas: 1
  selector:
    matchLabels: {app: practice13-fastapi}
  template:
    metadata:
      labels: {app: practice13-fastapi}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: fastapi
          image: practice13-fastapi:v1
          imagePullPolicy: Never
          env:
            - name: ENABLE_METRICS
              value: 'true'
          ports:
            - name: metrics
              containerPort: 8000
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 200m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /health, port: metrics}
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-app
  namespace: practice13
  labels: {app: practice13-fastapi, release: prometheus-stack}
spec:
  selector: {app: practice13-fastapi}
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fastapi-monitor
  namespace: practice13
  labels: {release: prometheus-stack}
spec:
  selector:
    matchLabels: {app: practice13-fastapi}
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
