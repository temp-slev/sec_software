# Prometheus + Alertmanager; Grafana отдельно не ставится (используется loki-grafana)
grafana:
  enabled: false
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 6h
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
alertmanager:
  config:
    route:
      receiver: webhook
      group_by: ["alertname"]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
    receivers:
      - name: "null"
      - name: webhook
        webhook_configs:
          - url: http://alert-webhook.monitoring.svc:8080/
            send_resolved: true
      # Telegram (нужны токен бота и chat_id):
      # - name: telegram
      #   telegram_configs:
      #     - bot_token: "<TOKEN>"
      #       chat_id: 123456789
  alertmanagerSpec:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: false
# Компоненты control plane в Docker Desktop недоступны для сбора метрик
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
