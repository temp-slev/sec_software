# Простой приёмник уведомлений Alertmanager: печатает полученные оповещения в лог пода
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-webhook-script
  namespace: monitoring
data:
  webhook.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            body = self.rfile.read(int(self.headers.get("Content-Length", 0)))
            data = json.loads(body or b"{}")
            for alert in data.get("alerts", []):
                print("ALERT", alert.get("status"), alert["labels"].get("alertname"),
                      alert["labels"].get("severity"),
                      alert.get("annotations", {}).get("summary"), flush=True)
            self.send_response(200)
            self.end_headers()

        def log_message(self, *args):
            pass

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-webhook
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-webhook
  template:
    metadata:
      labels:
        app: alert-webhook
    spec:
      containers:
        - name: webhook
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/webhook.py"]
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: alert-webhook-script
---
apiVersion: v1
kind: Service
metadata:
  name: alert-webhook
  namespace: monitoring
spec:
  selector:
    app: alert-webhook
  ports:
    - port: 8080
