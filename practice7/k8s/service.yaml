apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: practice7
spec:
  selector:
    app: practice7-fastapi
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fastapi
  namespace: practice7
spec:
  ingressClassName: traefik
  rules:
    - host: practice7.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fastapi-service
                port:
                  number: 80
