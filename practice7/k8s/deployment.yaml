apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-deployment
  namespace: practice7
spec:
  replicas: 2
  selector:
    matchLabels:
      app: practice7-fastapi
  template:
    metadata:
      labels:
        app: practice7-fastapi
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: fastapi
          image: practice7-fastapi:v1
          imagePullPolicy: Never
          envFrom:
            - configMapRef: {name: fastapi-config}
            - secretRef: {name: postgres-credentials}
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 200m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 30
            periodSeconds: 3
