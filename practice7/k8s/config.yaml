apiVersion: v1
kind: ConfigMap
metadata:
  name: fastapi-config
  namespace: practice7
data:
  APP_VERSION: '1.0.0'
  DB_HOST: postgres
  DB_NAME: fastapi_db
  DB_USER: postgres
---
# Демонстрационные данные доступа для локального учебного стенда.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: practice7
type: Opaque
stringData:
  DB_PASSWORD: local-practice7-password
